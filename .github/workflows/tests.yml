name: Tests

on:
  push:
    branches: [master]  # PR branches are covered by pull_request - avoids running every commit twice
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:  # A new push cancels the previous run for the same branch/PR
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runners are scarce and often queue for a long time. The macOS code paths are still
        # tested on these runners with mocked osascript/pgrep (tests/test_platform_support.py).
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10"]  # Matches the pinned dependencies in requirements.txt

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Check all modules import
        run: python -c "import main, platform_support, get_refresh_token"

      - name: Run tests
        run: pytest -v
